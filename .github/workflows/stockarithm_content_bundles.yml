name: StockArithm Content Bundles

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      run_date:
        description: "Run date YYYY-MM-DD. Defaults to today UTC."
        required: false
        type: string

permissions:
  contents: write

jobs:
  generate-bundles:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set run date
        run: |
          if [ -n "${{ inputs.run_date }}" ]; then
            echo "RUN_DATE=${{ inputs.run_date }}" >> "$GITHUB_ENV"
          else
            echo "RUN_DATE=$(date -u +%F)" >> "$GITHUB_ENV"
          fi

      - name: Generate StockArithm bundles
        run: |
          python scripts/stockarithm_content_generator.py --date "$RUN_DATE"

      - name: Commit generated bundles
        run: |
          git config user.name "sector-bot"
          git config user.email "sector-bot@users.noreply.github.com"
          git add marketing/content/ || true
          git diff --cached --quiet || git commit -m "chore: generate StockArithm content $RUN_DATE"
          git push || true
